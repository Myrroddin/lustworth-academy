name: Create GitHub Release

on:
  push:
    tags:
      - "v[0-9]*"

  workflow_dispatch:
    inputs:
      version:
        description: "Patch version (for example: 1.01)"
        required: true
        type: string
      prerelease:
        description: "Mark this GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release settings
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${{ inputs.version }}"
            version="${raw_version#v}"
            if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error title=Invalid version::Use a version like 1.03 or v1.03."
              exit 1
            fi
            tag="v${version}"
            prerelease="${{ inputs.prerelease }}"
            end_ref="HEAD"
          else
            tag="${GITHUB_REF_NAME}"
            if ! [[ "${tag}" =~ ^v[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error title=Invalid tag::Release tags must look like v1.03."
              exit 1
            fi
            version="${tag#v}"
            prerelease="false"
            end_ref="${tag}"
          fi

          if [[ "${end_ref}" == "HEAD" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          fi

          if [[ -z "${previous_tag}" ]]; then
            echo "::error title=Missing previous tag::A previous tagged release is required to generate an incremental game.patch automatically."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "end_ref=${end_ref}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.vars.outputs.version }}"
          previous_tag="${{ steps.vars.outputs.previous_tag }}"
          end_ref="${{ steps.vars.outputs.end_ref }}"

          mkdir -p dist

          game_patch="dist/lustworth-academy-v${version}-game.patch"
          git diff --binary "${previous_tag}" "${end_ref}" -- game/ > "$game_patch"

          tools_zip="dist/lustworth-academy-v${version}-tools.zip"
          git archive --format=zip --output="$tools_zip" "${end_ref}" tools

          sha256sum "$game_patch" "$tools_zip" > "dist/lustworth-academy-v${version}-SHA256SUMS.txt"

      - name: Generate release changelog
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          tag="${{ steps.vars.outputs.tag }}"
          end_ref="${{ steps.vars.outputs.end_ref }}"
          previous_tag="${{ steps.vars.outputs.previous_tag }}"
          release_date="$(date -u +%Y-%m-%d)"

          if [[ "${end_ref}" == "HEAD" ]]; then
            compare_target="${GITHUB_SHA}"
          else
            compare_target="${tag}"
          fi

          compare_url="https://github.com/${repo}/compare/${previous_tag}...${compare_target}"
          range="${previous_tag}..${end_ref}"

          commits=""
          current_subject=""
          current_body=()

          flush_commit() {
            if [[ -z "${current_subject}" ]]; then
              return
            fi

            if printf '%s\n' "${current_subject}" | grep -Eiq '^(chore(\(.+\))?:|ci(\(.+\))?:|build(\(.+\))?:|bump (version|toc)\b|version bump\b|release v?[0-9])'; then
              return
            fi

            commits+="* ${current_subject}"$'\n'

            for body_line in "${current_body[@]}"; do
              cleaned_line="$(printf '%s' "${body_line}" | sed -E 's/^[[:space:]]*[-*]?[[:space:]]*//; s/[[:space:]]+$//')"
              if [[ -n "${cleaned_line}" ]]; then
                commits+="    - ${cleaned_line}"$'\n'
              fi
            done
          }

          while IFS= read -r line; do
            if [[ "${line}" == "__END_COMMIT__" ]]; then
              flush_commit
              current_subject=""
              current_body=()
              continue
            fi

            if [[ -z "${current_subject}" ]]; then
              cleaned_subject="$(printf '%s' "${line}" | sed -E 's/^[[:space:]]*[-*]?[[:space:]]*//; s/[[:space:]]+$//')"
              if [[ -n "${cleaned_subject}" ]]; then
                current_subject="${cleaned_subject}"
              fi
            else
              current_body+=("${line}")
            fi
          done < <(git log --no-merges --pretty='%s%n%b%n__END_COMMIT__' "${range}")

          commits="${commits%$'\n'}"

          if [[ -z "${commits}" ]]; then
            commits="* No user-facing changes."
          fi

          mkdir -p dist

          cat > dist/CHANGELOG.md <<EOF
          # Lustworth Academy

          ## [${tag}](https://github.com/${repo}/tree/${tag}) (${release_date})
          [Full Changelog](${compare_url}) [Previous Releases](https://github.com/${repo}/releases)

          ${commits}

          ## Release assets

          These release assets are generated automatically by GitHub Actions:

          - `lustworth-academy-v${version}-game.patch`
          - `lustworth-academy-v${version}-tools.zip`
          - `lustworth-academy-v${version}-SHA256SUMS.txt`

          `game.patch` is an incremental update from `${previous_tag}` to `${tag}`.
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lustworth Academy Patch v${{ steps.vars.outputs.version }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          body_path: dist/CHANGELOG.md
          files: |
            dist/*
